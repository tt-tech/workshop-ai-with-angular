<div class="legacy">
  <h1>Change plan</h1>

  <p *ngIf="loading">Loading…</p>

  <div *ngIf="!loading && subscriber">
    <p>
      <strong>{{ subscriber.firstName }} {{ subscriber.lastName }}</strong>
      <span class="muted"> · {{ subscriber.status }} · balance {{ subscriber.balanceMad }} MAD</span>
    </p>

    <label>
      New plan
      <select (change)="onPlanSelected($event)">
        <option *ngFor="let p of plans" [value]="p.id" [selected]="p.id === selectedPlanId">
          {{ p.name }} — {{ p.monthlyPriceMad }} MAD / {{ p.dataGb }} GB
        </option>
      </select>
    </label>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button (click)="save()" [disabled]="saving || !canSave()">
      <span *ngIf="!saving">Save</span>
      <span *ngIf="saving">Saving…</span>
    </button>
  </div>

  <p *ngIf="!loading && !subscriber">Subscriber not found.</p>
</div>
